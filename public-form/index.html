<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hostel Admission Form</title>
  <style>
    :root{--primary:#4f46e5;--bg:#f8fafc;--text:#1e293b;--muted:#64748b;--border:#dbe2ea}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;padding:20px 12px}.card{max-width:680px;margin:auto;background:white;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 12px 30px #0f172a10}.head{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;padding:28px 22px;text-align:center}.head h1{margin:0 0 7px;font-size:27px}.head p{margin:0;opacity:.9}.body{padding:22px}.section{font-size:18px;color:var(--primary);font-weight:800;border-bottom:2px solid #eef2ff;padding-bottom:8px;margin:22px 0 8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-top:15px}label{display:block;font-weight:700;margin-bottom:7px}input,select,textarea{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:white}input:focus,select:focus,textarea:focus{outline:3px solid #e0e7ff;border-color:var(--primary)}textarea{min-height:90px}.file{padding:15px;background:#f8fafc;border:2px dashed var(--border)}.file-name{font-size:13px;color:#475569;margin-top:6px;overflow-wrap:anywhere}.notice,.message{padding:13px;border-radius:10px;margin:14px 0;white-space:pre-line}.notice{background:#eef2ff;color:#3730a3}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}button{width:100%;border:0;border-radius:11px;background:var(--primary);color:white;padding:15px;font-size:17px;font-weight:800;margin-top:22px}button:disabled{opacity:.65}.hidden{display:none}@media(max-width:560px){.row{grid-template-columns:1fr}.body{padding:18px}.head{padding:24px 18px}}
  </style>
</head>
<body><main class="card"><header class="head"><h1 id="title">Hostel admission</h1><p id="address">Loading form…</p></header><div class="body"><div id="message" class="message hidden"></div><form id="form" class="hidden">
  <input type="hidden" name="branchId" id="branchId"><input type="hidden" name="bookingToken" id="bookingToken">
  <div id="reservation" class="notice hidden"></div><div class="section">Basic details</div>
  <div class="row"><div class="field"><label>Name *</label><input name="name" id="name" required></div><div class="field"><label>Phone *</label><input name="phone" id="phone" inputmode="numeric" maxlength="10" required></div></div>
  <div class="field"><label>WhatsApp number *</label><input name="whatsappNumber" inputmode="numeric" maxlength="10" required></div>
  <div class="field"><label>Address *</label><textarea name="address" required></textarea></div>
  <div class="section">Family and work</div><div class="row"><div class="field"><label>Guardian name *</label><input name="guardianName" required></div><div class="field"><label>Guardian phone *</label><input name="guardianPhone" inputmode="numeric" maxlength="10" required></div></div>
  <div class="field"><label>Nearest police station *</label><input name="nearestPoliceStation" required></div><div class="row"><div class="field"><label>Occupation *</label><input name="occupation" required></div><div class="field"><label>Work location *</label><input name="workLocation" required></div></div>
  <div class="section">Stay details</div><div class="row"><div class="field"><label>Joining date *</label><input name="joiningDate" id="joiningDate" type="date" required></div><div class="field"><label>Expected leaving date</label><input name="leavingDate" id="leavingDate" type="date"></div></div>
  <div class="field"><label>Preferred room type *</label><select name="preferredRoomType" id="roomType" required></select></div><div class="field"><label>Notes</label><textarea name="notes" placeholder="Optional information"></textarea></div>
  <div class="section">Required documents</div><div class="field"><label>Profile photo *</label><input class="file" name="profilePhoto" type="file" accept="image/*" required><div class="file-name"></div></div><div class="field"><label>Aadhaar front image *</label><input class="file" name="aadhaarFront" type="file" accept="image/*" required><div class="file-name"></div></div><div class="field"><label>Aadhaar back image *</label><input class="file" name="aadhaarBack" type="file" accept="image/*" required><div class="file-name"></div></div>
  <button id="submit" type="submit">Submit application</button></form></div></main>
<script>
const API='https://mraiwlzhvsvwesbzwqgo.supabase.co/functions/v1/hostel-public';
const q=new URLSearchParams(location.search), form=document.getElementById('form'), msg=document.getElementById('message');
function show(kind,text){msg.className='message '+kind;msg.textContent=text;msg.scrollIntoView({behavior:'smooth'})}
function digits(v){return String(v||'').replace(/\D/g,'').slice(-10)}
async function parse(r){const text=await r.text();try{return JSON.parse(text)}catch{return{error:text||'Request failed'}}}
async function load(){try{const query=q.get('bookingToken')?'bookingToken='+encodeURIComponent(q.get('bookingToken')):'branchId='+encodeURIComponent(q.get('branchId')||'');const r=await fetch(API+'/api/form?'+query);const d=await parse(r);if(!r.ok)throw new Error(d.error);document.getElementById('title').textContent=d.branch.name;document.getElementById('address').textContent=d.branch.address||'Admission application';document.getElementById('branchId').value=d.branch.id;document.getElementById('bookingToken').value=q.get('bookingToken')||'';document.getElementById('roomType').innerHTML=d.roomTypes.map(x=>`<option value="${x.name.replace(/"/g,'&quot;')}">${x.name} - Rs ${x.admissionFee}</option>`).join('');if(d.booking){const b=d.booking;document.getElementById('reservation').classList.remove('hidden');document.getElementById('reservation').textContent=`Reserved: Room ${b.roomNumber}, bed ${b.bedNumber}. Name, phone, room and joining date are locked.`;for(const [id,val] of [['name',b.name],['phone',b.phone],['joiningDate',b.expectedJoiningDate]]){const el=document.getElementById(id);el.value=val;el.readOnly=true}document.getElementById('roomType').value=b.roomType;document.getElementById('roomType').disabled=true}form.classList.remove('hidden')}catch(e){show('error',e.message||'Could not load this form. Ask the hostel owner for a fresh link.')}}
document.querySelectorAll('input[type=file]').forEach(el=>el.addEventListener('change',()=>el.nextElementSibling.textContent=el.files[0]?'Selected: '+el.files[0].name:''));document.getElementById('joiningDate').addEventListener('change',e=>{document.getElementById('leavingDate').min=e.target.value});
form.addEventListener('submit',async e=>{e.preventDefault();const phone=digits(form.phone.value),wa=digits(form.whatsappNumber.value),guardian=digits(form.guardianPhone.value);if(phone.length!==10||wa.length!==10||guardian.length!==10)return show('error','Phone, WhatsApp and guardian phone must each contain exactly 10 digits.');form.phone.value=phone;form.whatsappNumber.value=wa;form.guardianPhone.value=guardian;const button=document.getElementById('submit');button.disabled=true;button.textContent='Submitting…';try{const data=new FormData(form);if(document.getElementById('roomType').disabled)data.set('preferredRoomType',document.getElementById('roomType').value);const r=await fetch(API+'/api/admissions/apply',{method:'POST',body:data});const d=await parse(r);if(!r.ok)throw new Error(d.error);show('success','Application submitted successfully. Opening payment instructions…');setTimeout(()=>location.href='payment.html?paymentId='+encodeURIComponent(d.paymentId),700)}catch(err){show('error',err.message||'Could not submit. Please try again.');button.disabled=false;button.textContent='Submit application'}});load();
</script></body></html>
