<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay by UPI</title><style>*{box-sizing:border-box}body{font-family:Arial;background:#f8fafc;margin:0;padding:22px 12px;color:#0f172a}.card{max-width:480px;margin:auto;background:white;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px #0f172a12}.head{background:#0f172a;color:white;padding:22px}.body{padding:22px}.amount{text-align:center;font-size:38px;font-weight:900;color:#2563eb;padding:20px}.row{display:flex;justify-content:space-between;gap:15px;padding:8px 0}.row b{text-align:right}.box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px;margin-top:14px}.btn{display:block;text-align:center;text-decoration:none;padding:15px;border-radius:10px;background:#2563eb;color:white;font-weight:800;margin-top:14px}.wa{background:#16a34a}.notice{background:#fffbeb;color:#92400e;padding:13px;border-radius:10px;margin-top:15px}.error{color:#991b1b}</style></head><body><main class="card"><header class="head"><h1>Pay by UPI</h1><p id="branch">Loading invoice…</p></header><div class="body" id="body"></div></main><script>const API='https://mraiwlzhvsvwesbzwqgo.supabase.co/functions/v1/hostel-public';const id=new URLSearchParams(location.search).get('paymentId')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch(API+'/api/payment?paymentId='+encodeURIComponent(id)).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error);document.getElementById('branch').textContent=d.branchName;document.getElementById('body').innerHTML=`<div class="amount">Rs ${esc(d.amount)}</div><div class="row"><span>Name</span><b>${esc(d.payerName)}</b></div><div class="row"><span>For</span><b>${esc(d.roomNumber?'Room '+d.roomNumber:d.paymentType+' payment')}</b></div><div class="row"><span>Invoice</span><b>${esc(d.id)}</b></div>${d.upiId?`<div class="box">Pay to UPI ID<br><b>${esc(d.upiId)}</b><br><small>${esc(d.receiverName)}</small></div><a class="btn" href="${esc(d.upiUrl)}">Open UPI app</a>`:'<div class="notice">UPI is not configured. Contact the hostel owner before paying.</div>'}<div class="notice">After payment, take a screenshot and share it with the hostel owner.</div><a class="btn wa" href="${d.whatsappNumber?'https://wa.me/91'+esc(d.whatsappNumber):'https://wa.me/'}">Share screenshot on WhatsApp</a>`}).catch(e=>document.getElementById('body').innerHTML='<p class="error">'+esc(e.message||'Invoice not found')+'</p>');</script></body></html>
