<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open HostelHub</title>
  <style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif}.card{width:min(440px,100%);padding:28px;background:white;border:1px solid #e2e8f0;border-radius:18px;text-align:center;box-shadow:0 12px 30px #0f172a12}h1{margin:0 0 10px}.muted{color:#64748b;line-height:1.5}.button{display:block;margin-top:20px;padding:15px;border-radius:11px;background:#4f46e5;color:white;text-decoration:none;font-weight:800}.error{color:#991b1b;background:#fee2e2;padding:12px;border-radius:9px}</style>
</head>
<body><main class="card"><h1>Login confirmed</h1><p id="message" class="muted">Opening HostelHub…</p><a id="open" class="button" href="#">Open HostelHub</a></main>
<script>
  const params = new URLSearchParams(location.search);
  const returnTo = params.get('returnTo');
  const session = location.hash || '';
  const button = document.getElementById('open');
  const message = document.getElementById('message');
  if (!returnTo || !/^((hostelhub|exp):\/\/|https?:\/\/)/i.test(returnTo)) {
    message.className = 'error'; message.textContent = 'The app return address is missing. Open HostelHub and request a new login email.'; button.style.display = 'none';
  } else {
    const target = returnTo + session;
    button.href = target;
    setTimeout(() => { location.href = target; }, 250);
  }
</script></body></html>
