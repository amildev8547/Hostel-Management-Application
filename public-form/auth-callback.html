<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Set HostelHub Password</title>
  <style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif}.card{width:min(440px,100%);padding:28px;background:white;border:1px solid #e2e8f0;border-radius:18px;text-align:center;box-shadow:0 12px 30px #0f172a12}h1{margin:0 0 10px}.muted{color:#64748b;line-height:1.5}.button{display:block;margin-top:20px;padding:15px;border-radius:11px;background:#4f46e5;color:white;text-decoration:none;font-weight:800}.error{color:#991b1b;background:#fee2e2;padding:12px;border-radius:9px}</style>
</head>
<body><main class="card"><h1 id="title">Set your password</h1><p id="message" class="muted">Choose a password you can remember. Use it with your email inside HostelHub.</p><form id="passwordForm"><input id="password" type="password" minlength="8" required placeholder="New password" style="width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px"><input id="confirm" type="password" minlength="8" required placeholder="Enter password again" style="width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;margin-top:12px"><button class="button" style="border:0;width:100%;font-size:16px" type="submit">Save password</button></form><a id="open" class="button" href="hostelhub://auth/callback" style="display:none">Open HostelHub</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script>
<script>
  const message=document.getElementById('message'), form=document.getElementById('passwordForm'), open=document.getElementById('open');
  const values=new URLSearchParams(location.hash.slice(1));
  const client=supabase.createClient('https://mraiwlzhvsvwesbzwqgo.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yYWl3bHpodnN2d2VzYnp3cWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzA2ODcsImV4cCI6MjEwMzg0NjY4N30.WoLE4WfxSOPQ014MUeU-jYDtf5jjhiMpmNN-dETHWf0');
  async function prepare(){const access=values.get('access_token'),refresh=values.get('refresh_token');if(!access||!refresh){message.className='error';message.textContent='This password link is invalid or expired. Request a fresh password link from the app.';form.style.display='none';return}const {error}=await client.auth.setSession({access_token:access,refresh_token:refresh});if(error){message.className='error';message.textContent='This password link has expired. Request a fresh one.';form.style.display='none'}}
  form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password.length<8){message.className='error';message.textContent='Use at least 8 characters.';return}if(password!==confirm){message.className='error';message.textContent='The passwords do not match.';return}const button=form.querySelector('button');button.disabled=true;button.textContent='Saving…';const {error}=await client.auth.updateUser({password});if(error){message.className='error';message.textContent=error.message;button.disabled=false;button.textContent='Save password';return}document.getElementById('title').textContent='Password saved';message.className='muted';message.textContent='Return to HostelHub and log in with your email and new password.';form.style.display='none';open.style.display='block'});prepare();
</script></body></html>
